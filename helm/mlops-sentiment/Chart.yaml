apiVersion: v2
name: mlops-kubesense
description: KubeSense — production MLOps sentiment analysis microservice by Aismail
type: application
version: 0.1.0
appVersion: "1.0.0"
keywords:
  - mlops
  - kubesense
  - sentiment-analysis
  - machine-learning
  - monitoring
  - fastapi
home: https://github.com/ismailubts/KubeSense
sources:
  - https://github.com/ismailubts/KubeSense
maintainers:
  - name: Aismail
    email: aismail@7kingscode.com
dependencies:
  - name: prometheus
    version: "25.8.0"
    repository: "https://prometheus-community.github.io/helm-charts"
    condition: prometheus.enabled
  - name: grafana
    version: "7.0.19"
    repository: "https://grafana.github.io/helm-charts"
    condition: grafana.enabled
  - name: alertmanager
    version: "1.7.0"
    repository: "https://prometheus-community.github.io/helm-charts"
    condition: alertmanager.enabled
annotations:
  category: MLOps
  licenses: MIT
